[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stattik"
version = "0.1.0"
description = ""
readme = "README.md"          # remove if you have no README
requires-python = ">=3.12"
authors = [
    { name = "Kurtis Fields", email = "kurtisfields@gmail.com" },
]
dependencies = [
    "click>=8.5,<9",
    "loguru>=0.7.3,<0.8",
    "python-frontmatter>=1.3,<2",
    "lxml>=6.1,<7",
    "pydantic>=2.14,<3",
    "grotto-core>=0.1,<0.2",
    "grotto-ogm>=0.1,<0.2",
    "uvicorn[standard]>=0.54,<0.55",
    "PyYAML>=6.0.3,<7",
    "emoji>=2.16,<3",
    "python-dotenv>=1.2,<2",
    "beautifulsoup4>=4.15,<5",
    "aioreactive>=0.20,<0.21",
    "requests>=2.34,<3",
    "markblocks>=0.1.0,<0.2",
    "starlette>=1.9,<2"
]

[project.scripts]
stattik = "stattik.management:cli"

[tool.hatch.build.targets.wheel]
packages = ["stattik"]

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
workspace.members = [
  "../markblocks",
  "../../../grotto/pkg/core",
  "../../../grotto/pkg/ogm",
]
dependencies = ["uv", "pytest>=9"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"