[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stattik-demo-miniblog-bulma"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["gql[all]>=3.4.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["demo_miniblog_bulma"]

[tool.hatch.envs.default]
python = "3.12"
installer = "uv"
workspace.members = [
  "../../pkg/markblocks",
  "../../pkg/stattik",
  "../../pkg/theme-bulma",
  "../../pkg/plugin-search-fuse",
  "../../pkg/app-search-fuse-bulma",
]
dependencies = ["uv", "pytest"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"